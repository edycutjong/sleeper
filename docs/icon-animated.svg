<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Sleeper animated mark: years of events orbit the gate, a threat is recognized, and the release is held">
  <defs>
    <linearGradient id="ringGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB224"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB224"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0%" stop-color="#141B33"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </radialGradient>
    <filter id="dotGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="breathBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <style>
    /* master timeline: 6s — every CSS animation and SMIL dur matches */
    .story { animation: storyFade 6s linear infinite; }
    @keyframes storyFade {
      0% { opacity: 0; } 2% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; }
    }
    .dot { transform-box: fill-box; transform-origin: center; animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.2,1.4,.4,1); }
    .d1 { animation-name: pop1; } .d2 { animation-name: pop2; } .d3 { animation-name: pop3; } .d4 { animation-name: pop4; }
    @keyframes pop1 { 0%, 16% { transform: scale(0); opacity: 0; } 19% { transform: scale(1.35); opacity: 1; } 21.5%, 100% { transform: scale(1); opacity: 1; } }
    @keyframes pop2 { 0%, 23% { transform: scale(0); opacity: 0; } 26% { transform: scale(1.35); opacity: 1; } 28.5%, 100% { transform: scale(1); opacity: 1; } }
    @keyframes pop3 { 0%, 30% { transform: scale(0); opacity: 0; } 33% { transform: scale(1.3); opacity: 1; } 35.5%, 100% { transform: scale(1); opacity: 1; } }
    @keyframes pop4 { 0%, 37% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.3); opacity: 1; } 42.5%, 100% { transform: scale(1); opacity: 1; } }
    .threat-jitter { animation: jitter 6s steps(1, end) infinite; }
    @keyframes jitter {
      0%, 48% { transform: translate(0, 0); }
      49% { transform: translate(-4px, 3px); }
      50% { transform: translate(3px, -3px); }
      51% { transform: translate(-3px, -2px); }
      52% { transform: translate(4px, 2px); }
      53%, 100% { transform: translate(0, 0); }
    }
    .threat-pop { transform-box: fill-box; transform-origin: center; animation: threatPop 6s cubic-bezier(.2,1.4,.4,1) infinite; }
    @keyframes threatPop { 0%, 43% { transform: scale(0); opacity: 0; } 46.5% { transform: scale(1.45); opacity: 1; } 49%, 100% { transform: scale(1); opacity: 1; } }
    .bars { transform-box: fill-box; transform-origin: center; animation: barStamp 6s cubic-bezier(.2,1.4,.4,1) infinite; }
    @keyframes barStamp {
      0%, 58% { transform: scale(0.3); opacity: 0; }
      63% { transform: scale(1.18); opacity: 1; }
      66.5% { transform: scale(0.96); opacity: 1; }
      70%, 100% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- persistent faint base so the loop restart never blanks the mark -->
  <g opacity="0.22">
    <circle cx="256" cy="256" r="206" fill="none" stroke="#7C5CFF" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="2.5 9" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="146" fill="none" stroke="#4A4470" stroke-width="24"/>
  </g>

  <g class="story">
    <!-- core disc -->
    <circle cx="256" cy="256" r="146" fill="url(#coreGlow)">
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.08;0.5;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- gate ring draws itself in (0 -> 15%) -->
    <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ringGrad)" stroke-width="24"
            pathLength="100" stroke-dasharray="100" stroke-linecap="round" transform="rotate(-90 256 256)">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.02;0.16;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- amber recognition flash on the ring at the match beat -->
    <circle cx="256" cy="256" r="146" fill="none" stroke="#FFB224" stroke-width="24">
      <animate attributeName="opacity" values="0;0;0;0.75;0;0" keyTimes="0;0.5;0.53;0.56;0.62;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- memory trail: the years accumulate -->
    <circle class="dot d1" cx="62.4"  cy="185.5" r="9"  fill="#7C5CFF" fill-opacity="0.55"/>
    <circle class="dot d2" cx="123.5" cy="98.2"  r="12" fill="#7C5CFF" fill-opacity="0.75"/>
    <circle class="dot d3" cx="220.2" cy="53.1"  r="15" fill="#A98BFF"/>
    <circle class="dot d4" cx="326.5" cy="62.4"  r="19" fill="#E0A24C"/>

    <!-- the threat event arrives and glitches -->
    <g class="threat-jitter">
      <circle class="threat-pop" cx="413.8" cy="123.5" r="24" fill="#FFB224" filter="url(#dotGlow)"/>
    </g>

    <!-- the HOLD stamps in -->
    <g class="bars">
      <rect x="210" y="200" width="36" height="112" rx="18" fill="url(#barGrad)"/>
      <rect x="266" y="200" width="36" height="112" rx="18" fill="url(#barGrad)"/>
    </g>

    <!-- ripple burst as the gate closes -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#FFB224" stroke-width="3">
      <animate attributeName="r" values="150;150;218;218" keyTimes="0;0.63;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.64;0.7;0.8;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- glow breath -->
    <g filter="url(#breathBlur)">
      <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ringGrad)" stroke-width="24">
        <animate attributeName="opacity" values="0;0;0;0.5;0.12;0.45;0" keyTimes="0;0.66;0.72;0.8;0.86;0.92;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
