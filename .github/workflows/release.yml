name: Release

# Tags only. This deliberately does NOT run on pushes to main: CI and CodeQL already gate
# every commit, and a release workflow that fires on ordinary pushes would either duplicate
# that work or turn the default branch red for a reason unrelated to the code.
#
# Cutting a release is therefore an explicit act — `git tag vX.Y.Z && git push origin vX.Y.Z` —
# and the tag is what the repo is judged against at that point in time.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # notes are generated from history

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that does not build is worse than no tag. The suite runs with no database and
      # no AWS account — the cluster-backed tests skip and say why, which is the same output
      # a judge gets on a fresh clone.
      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The README states its own test counts and CI regenerates them, so a release cannot
      # ship prose that disagrees with the suite it describes.
      - name: Counts are current
        run: |
          npm run counts
          if ! git diff --quiet -- tests/counts.json; then
            echo "::error::tests/counts.json is stale — run 'npm run counts' and commit it"
            git diff -- tests/counts.json
            exit 1
          fi

      - name: Version matches tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json $PKG — bump one of them"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving its notes alone"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
